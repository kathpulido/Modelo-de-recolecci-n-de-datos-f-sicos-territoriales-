<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geovisor · Catastro Étnico</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 50%, #40916c 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    background: #fff;
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.3);
  }

  .logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo-icon { font-size: 52px; line-height: 1; }
  .logo h1 {
    font-size: 1.4rem;
    font-weight: 700;
    color: #1b4332;
    margin-top: 8px;
  }
  .logo p {
    font-size: 0.85rem;
    color: #6b7280;
    margin-top: 4px;
  }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #d1d5db;
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
    transition: border-color .2s;
    margin-bottom: 18px;
  }
  input:focus { border-color: #2d6a4f; box-shadow: 0 0 0 3px rgba(45,106,79,.15); }

  button {
    width: 100%;
    padding: 13px;
    background: #2d6a4f;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  button:hover  { background: #1b4332; }
  button:active { transform: scale(.98); }
  button:disabled { background: #9ca3af; cursor: not-allowed; }

  .error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #dc2626;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.88rem;
    margin-bottom: 16px;
    display: none;
  }

  .footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.78rem;
    color: #9ca3af;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">🌿</div>
    <h1>Geovisor Territorial</h1>
    <p>Catastro Étnico — Colombia</p>
  </div>

  <div id="error" class="error"></div>

  <form id="form" onsubmit="login(event)">
    <label for="username">Usuario</label>
    <input id="username" type="text" placeholder="admin" autocomplete="username" required>

    <label for="password">Contraseña</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>

    <button id="btn" type="submit">Iniciar sesión</button>
  </form>

  <p class="footer">Registro Territorial de Comunidades Étnicas · Bot WhatsApp</p>
</div>

<script>
async function login(e) {
  e.preventDefault()
  const btn = document.getElementById('btn')
  const err = document.getElementById('error')
  err.style.display = 'none'
  btn.disabled = true
  btn.textContent = 'Verificando…'

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      })
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || 'Error de autenticación')

    localStorage.setItem('geo_token', data.token)
    localStorage.setItem('geo_user',  JSON.stringify(data.user))
    window.location.href = '/'
  } catch (e) {
    err.textContent = e.message
    err.style.display = 'block'
    btn.disabled = false
    btn.textContent = 'Iniciar sesión'
  }
}

// Si ya hay token válido, ir directo al mapa
if (localStorage.getItem('geo_token')) window.location.href = '/'
</script>
</body>
</html>
