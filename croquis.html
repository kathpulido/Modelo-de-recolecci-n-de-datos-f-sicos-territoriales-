<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0f5132"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Croquis del Territorio — Registro Catastral</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
<style>
:root{
  --verde-900:#0f5132; --verde-700:#15803d; --verde-600:#1e9750; --verde-500:#22a85c; --verde-100:#e7f6ec;
  --ambar-500:#d97706; --ambar-100:#fef3c7;
  --rojo-600:#dc2626; --rojo-100:#fee2e2;
  --azul-600:#2563eb; --azul-100:#dbeafe;
  --tinta:#132a1e; --gris:#5b6b63; --gris-claro:#8a978f;
  --superficie:#ffffff; --fondo:#f4faf6; --borde:#dce8e0;
  --sombra-sm:0 1px 3px rgba(15,81,50,.10),0 1px 2px rgba(15,81,50,.06);
  --sombra-lg:0 -8px 24px rgba(15,42,30,.12), 0 -2px 8px rgba(15,42,30,.06);
  --sombra-flot:0 4px 14px rgba(15,42,30,.18);
  --radio:16px; --radio-sm:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  background:var(--fondo);color:var(--tinta);display:flex;flex-direction:column;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}

header{
  background:linear-gradient(135deg,var(--verde-900),var(--verde-700) 70%);
  color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;
  box-shadow:0 2px 14px rgba(15,81,50,.35);z-index:600;position:relative;
}
header::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 90% -20%,rgba(255,255,255,.14),transparent 55%);pointer-events:none}
#icono-app{
  width:38px;height:38px;flex-shrink:0;border-radius:11px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;font-size:1.15rem;
  border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(2px);
}
#titulos{flex:1;min-width:0}
header h1{font-size:.95rem;font-weight:700;line-height:1.3;letter-spacing:-.01em}
header p{font-size:.71rem;opacity:.88;margin-top:1px}
#estado{display:flex;align-items:center;gap:6px;font-size:.68rem;font-weight:700;padding:6px 10px;border-radius:99px;white-space:nowrap;flex-shrink:0}
#estado.on{background:rgba(16,185,129,.22);color:#d1fae5}
#estado.off{background:rgba(245,158,11,.25);color:#fef3c7}
#dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.on #dot{background:#34d399}.off #dot{background:#fbbf24;animation:pulso 1.4s infinite}
@keyframes pulso{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

#pasos{
  background:var(--superficie);border-bottom:1px solid var(--borde);
  padding:11px 14px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;
}
#pasos::-webkit-scrollbar{display:none}
.paso{display:flex;align-items:center;gap:7px;flex-shrink:0;font-size:.72rem;color:var(--gris);font-weight:600}
.paso b{
  width:19px;height:19px;border-radius:50%;background:var(--verde-100);color:var(--verde-700);
  display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:800;flex-shrink:0;
}
.paso.hecho{color:var(--verde-700)}
.paso.hecho b{background:var(--verde-600);color:#fff}

#mapa-wrap{flex:1;min-height:0;position:relative}
#mapa{position:absolute;inset:0}

#btn-ubicarme{
  position:absolute;bottom:16px;right:12px;z-index:450;width:44px;height:44px;border-radius:50%;
  background:var(--superficie);border:none;box-shadow:var(--sombra-flot);display:flex;align-items:center;
  justify-content:center;font-size:1.15rem;cursor:pointer;color:var(--verde-700);
}
#btn-ubicarme:active{transform:scale(.94)}

#punto-actual{position:relative;width:14px;height:14px;border-radius:50%;background:var(--azul-600);border:3px solid #fff;box-shadow:0 0 0 2px var(--azul-600)}
#punto-actual::after{content:'';position:absolute;inset:-10px;border-radius:50%;background:var(--azul-600);opacity:.25;animation:pulso-ubi 1.8s ease-out infinite}
@keyframes pulso-ubi{0%{transform:scale(.3);opacity:.5}100%{transform:scale(1.8);opacity:0}}

#panel{
  background:var(--superficie);border-top:1px solid var(--borde);
  border-radius:var(--radio) var(--radio) 0 0;
  padding:14px 16px calc(14px + var(--safe-b));box-shadow:var(--sombra-lg);z-index:550;position:relative;
}
#panel::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:99px;background:var(--borde)}
#area-card{
  display:flex;align-items:center;justify-content:space-between;background:var(--verde-100);
  border-radius:var(--radio-sm);padding:11px 13px;margin:10px 0 12px;
}
#area-card .etiqueta{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;color:var(--verde-900)}
#area-card .etiqueta .ic{font-size:1rem}
#area-valor{font-size:1.02rem;font-weight:800;color:var(--verde-900)}
#area-valor small{font-size:.68rem;font-weight:600;color:var(--verde-700);display:block;text-align:right;margin-top:1px}
.fila{display:flex;gap:10px}
.btn{
  flex:1;padding:13px;border:none;border-radius:12px;font-size:.86rem;font-weight:700;cursor:pointer;
  font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .12s,filter .12s,opacity .12s;
}
.btn:active{transform:scale(.97)}
.b-guardar{background:linear-gradient(135deg,var(--verde-600),var(--verde-700));color:#fff;box-shadow:0 3px 10px rgba(21,128,61,.35)}
.b-guardar:disabled{background:#c7d1cb;box-shadow:none;cursor:not-allowed;filter:none;color:#8a978f}
.b-borrar{background:var(--superficie);color:var(--rojo-600);border:1.5px solid var(--rojo-100)}
.spinner{width:15px;height:15px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:girar .7s linear infinite;display:none}
.b-guardar.cargando .spinner{display:inline-block}
.b-guardar.cargando .txt-btn{display:none}
@keyframes girar{to{transform:rotate(360deg)}}

#msg{
  margin-top:11px;font-size:.79rem;font-weight:600;text-align:left;padding:10px 12px;border-radius:11px;
  display:none;align-items:flex-start;gap:8px;line-height:1.4;animation:entrar .25s ease-out;
}
@keyframes entrar{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
#msg .ic{font-size:1rem;flex-shrink:0;margin-top:1px}
#msg.ok{display:flex;background:var(--verde-100);color:var(--verde-900)}
#msg.pend{display:flex;background:var(--ambar-100);color:#92400e}
#msg.err{display:flex;background:var(--rojo-100);color:#991b1b}

.leaflet-draw-toolbar a{background-color:var(--superficie)!important}
.leaflet-control-attribution{font-size:.62rem!important}

@media (prefers-color-scheme:dark){
  :root{
    --fondo:#0d1712; --superficie:#152420; --borde:#25382f; --tinta:#eaf3ee; --gris:#93a49b;
    --verde-100:#173a29;
  }
  #area-card .etiqueta,#area-valor{color:#8fe3ae}
  .leaflet-draw-toolbar a{background-color:#1b2a24!important;filter:invert(.85) hue-rotate(180deg)}
}
</style>
</head>
<body>

<header>
  <div id="icono-app">📐</div>
  <div id="titulos">
    <h1>Croquis del territorio</h1>
    <p>Dibuje el contorno aproximado sobre el mapa</p>
  </div>
  <div id="estado" class="on"><span id="dot"></span><span id="estado-txt">En línea</span></div>
</header>

<div id="pasos">
  <div class="paso hecho"><b>1</b> Ubíquese en el mapa</div>
  <div class="paso" id="paso-2"><b>2</b> Marque cada esquina</div>
  <div class="paso" id="paso-3"><b>3</b> Cierre la figura</div>
  <div class="paso" id="paso-4"><b>4</b> Guarde y envíe</div>
</div>

<div id="mapa-wrap">
  <div id="mapa"></div>
  <button id="btn-ubicarme" title="Ir a mi ubicación">📍</button>
</div>

<div id="panel">
  <div id="area-card">
    <div class="etiqueta"><span class="ic">📏</span> Área aproximada</div>
    <div id="area-valor">— sin dibujar —</div>
  </div>
  <div class="fila">
    <button class="btn b-borrar" id="btn-borrar">🗑️ Borrar</button>
    <button class="btn b-guardar" id="btn-guardar" disabled>
      <span class="spinner"></span><span class="txt-btn">💾 Guardar y enviar</span>
    </button>
  </div>
  <div id="msg"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script>
/* ============================================================
   Croquis georreferenciado — dibujo manual del perímetro
   Envía el resultado a POST /api/perimetro identificado por
   un token de un solo uso que llega en la URL (?token=...),
   generado por el bot al ofrecer este enlace en WhatsApp.
   ============================================================ */
const params = new URLSearchParams(location.search)
const TOKEN  = params.get('token') || ''
const EP     = `${location.origin}/api/perimetro`
const LS_KEY = `perimetro_pendiente_${TOKEN}`
// Si la persona ya compartió su ubicación por WhatsApp, el bot la manda
// aquí mismo en el enlace — así no hace falta pedirle permiso de GPS al
// navegador (que dentro del navegador propio de WhatsApp a veces ni
// siquiera se puede pedir).
const LAT_QS = params.get('lat')
const LON_QS = params.get('lon')

if (!TOKEN) {
  document.getElementById('pasos').innerHTML =
    '<div class="paso" style="color:#dc2626">⚠️ Este enlace no tiene un código de registro válido. Pida al sistema que le envíe el enlace de nuevo desde WhatsApp.</div>'
}

/* ---------- Mapa base ---------- */
const mapa = L.map('mapa', { zoomControl: true }).setView([4.5709, -74.2973], 6) // centro: Colombia
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 20,
  attribution: '© OpenStreetMap'
}).addTo(mapa)
L.control.scale({ metric: true, imperial: false, position: 'bottomleft' }).addTo(mapa)

// Marcador azul "usted está aquí" — se muestra apenas se abre la página,
// sin esperar a que el usuario toque nada.
let marcadorUbicacion = null
function colocarMarcador(lat, lon, zoom) {
  const ll = [lat, lon]
  mapa.setView(ll, zoom || 17)
  if (!marcadorUbicacion) {
    marcadorUbicacion = L.marker(ll, {
      icon: L.divIcon({ className: '', html: '<div id="punto-actual"></div>', iconSize: [14, 14] }),
      zIndexOffset: 500,
      interactive: false
    }).addTo(mapa)
  } else {
    marcadorUbicacion.setLatLng(ll)
  }
}

function irAMiUbicacion(zoom) {
  if (!navigator.geolocation) {
    mostrarMsg('pend', '📍', 'Este navegador no admite ubicación automática — puede dibujar el croquis igual, solo sin el punto azul.')
    return
  }
  navigator.geolocation.getCurrentPosition(
    pos => colocarMarcador(pos.coords.latitude, pos.coords.longitude, zoom),
    err => {
      // Antes esto fallaba en silencio y la persona se quedaba sin saber
      // por qué nunca aparecía el punto azul. Ahora se avisa el motivo:
      // permiso bloqueado, ubicación no disponible, o se demoró demasiado.
      const motivo = err && err.code === 1
        ? 'el navegador tiene bloqueado el permiso de ubicación para esta página'
        : err && err.code === 2
          ? 'no se pudo determinar la ubicación en este momento'
          : 'se demoró demasiado en responder'
      mostrarMsg('pend', '📍', `No se pudo mostrar su ubicación (${motivo}). Puede seguir dibujando el croquis igual, con el mapa como está — o toque 📍 para intentar de nuevo.`)
    },
    { enableHighAccuracy: true, timeout: 8000 }
  )
}

const latInicial = parseFloat(LAT_QS)
const lonInicial = parseFloat(LON_QS)
if (LAT_QS !== null && LON_QS !== null && !isNaN(latInicial) && !isNaN(lonInicial)) {
  // Ya tenemos la ubicación que la persona compartió por WhatsApp — se
  // usa de una vez, sin pedir permiso al navegador.
  colocarMarcador(latInicial, lonInicial, 17)
} else {
  irAMiUbicacion(17) // no había ubicación de WhatsApp — se intenta por GPS del navegador
}
document.getElementById('btn-ubicarme').addEventListener('click', () => irAMiUbicacion(18))

/* ---------- Herramienta de dibujo (un solo polígono) ---------- */
const capaDibujo = new L.FeatureGroup()
mapa.addLayer(capaDibujo)

const controlDibujo = new L.Control.Draw({
  position: 'topright',
  draw: {
    polygon: { allowIntersection: false, showArea: false, shapeOptions: { color: '#15803d', weight: 3, fillColor: '#22a85c', fillOpacity: .18 } },
    polyline: false, rectangle: false, circle: false, circlemarker: false, marker: false
  },
  edit: { featureGroup: capaDibujo, remove: false }
})
mapa.addControl(controlDibujo)

let poligonoActual = null

const RADIO_TIERRA = 6378137 // metros
function toRad(g) { return g * Math.PI / 180 }
// Área geodésica aproximada (fórmula esférica de exceso, igual a la
// usada internamente por Leaflet.GeometryUtil). Suficiente precisión
// para predios de tamaño rural típico.
function areaGeodesica(latlngs) {
  const n = latlngs.length
  if (n < 3) return 0
  let area = 0
  for (let i = 0; i < n; i++) {
    const p1 = latlngs[i]
    const p2 = latlngs[(i + 1) % n]
    area += (toRad(p2.lng) - toRad(p1.lng)) * (2 + Math.sin(toRad(p1.lat)) + Math.sin(toRad(p2.lat)))
  }
  return Math.abs(area * RADIO_TIERRA * RADIO_TIERRA / 2)
}

function marcarPaso(n, hecho) {
  const el = document.getElementById(`paso-${n}`)
  if (el) el.classList.toggle('hecho', hecho)
}

function actualizarArea() {
  const btn = document.getElementById('btn-guardar')
  const out = document.getElementById('area-valor')
  if (!poligonoActual) {
    out.innerHTML = '— sin dibujar —'
    btn.disabled = true
    marcarPaso(2, false); marcarPaso(3, false); marcarPaso(4, false)
    return
  }
  const latlngs = poligonoActual.getLatLngs()[0]
  const ha = areaGeodesica(latlngs) / 10000
  out.innerHTML = `${ha.toFixed(2)} ha <small>${latlngs.length} vértices</small>`
  const listo = latlngs.length >= 3
  btn.disabled = !listo
  marcarPaso(2, true); marcarPaso(3, listo); marcarPaso(4, false)
}

mapa.on(L.Draw.Event.CREATED, e => {
  capaDibujo.clearLayers()
  poligonoActual = e.layer
  capaDibujo.addLayer(poligonoActual)
  actualizarArea()
})
mapa.on(L.Draw.Event.EDITED, actualizarArea)
mapa.on(L.Draw.Event.DELETED, () => { poligonoActual = null; actualizarArea() })

document.getElementById('btn-borrar').addEventListener('click', () => {
  capaDibujo.clearLayers()
  poligonoActual = null
  actualizarArea()
})

/* ---------- Estado de conexión ---------- */
function setEstado(enLinea) {
  const el = document.getElementById('estado')
  el.className = enLinea ? 'on' : 'off'
  document.getElementById('estado-txt').textContent = enLinea ? 'En línea' : 'Sin conexión'
}
setEstado(navigator.onLine)
window.addEventListener('online', () => { setEstado(true); intentarEnviarPendiente() })
window.addEventListener('offline', () => setEstado(false))

/* ---------- Envío (con cola local si no hay internet) ---------- */
function mostrarMsg(tipo, icono, texto) {
  const m = document.getElementById('msg')
  m.className = tipo
  m.innerHTML = `<span class="ic">${icono}</span><span>${texto}</span>`
}

async function enviar(payload) {
  const res = await fetch(EP, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
    signal: AbortSignal.timeout(15000)
  })
  if (!res.ok) throw new Error('respuesta no OK')
  return res.json()
}

async function intentarEnviarPendiente() {
  const raw = localStorage.getItem(LS_KEY)
  if (!raw) return
  try {
    await enviar(JSON.parse(raw))
    localStorage.removeItem(LS_KEY)
    marcarPaso(4, true)
    mostrarMsg('ok', '✅', 'Enviado. Ya puede cerrar esta ventana y continuar en WhatsApp.')
  } catch {
    // sigue offline, se reintenta más tarde
  }
}

document.getElementById('btn-guardar').addEventListener('click', async () => {
  if (!poligonoActual) return
  const latlngs  = poligonoActual.getLatLngs()[0]
  const geojson  = poligonoActual.toGeoJSON()
  const areaHa   = areaGeodesica(latlngs) / 10000

  const payload = {
    token: TOKEN,
    metodo: 'croquis_manual',
    geojson: geojson.geometry,
    area_ha: Number(areaHa.toFixed(4)),
    vertices: latlngs.length
  }

  const btn = document.getElementById('btn-guardar')
  btn.disabled = true
  btn.classList.add('cargando')

  try {
    await enviar(payload)
    marcarPaso(4, true)
    mostrarMsg('ok', '✅', '¡Enviado correctamente! Ya puede cerrar esta ventana y continuar la conversación en WhatsApp.')
  } catch {
    localStorage.setItem(LS_KEY, JSON.stringify(payload))
    mostrarMsg('pend', '📦', 'Sin conexión: el croquis quedó guardado en este teléfono y se enviará solo apenas recupere señal. Puede cerrar esta ventana con tranquilidad.')
  } finally {
    btn.disabled = false
    btn.classList.remove('cargando')
  }
})

// Al cargar, si ya había un croquis guardado localmente sin enviar, intentar de una vez
window.addEventListener('load', () => {
  if (navigator.onLine) intentarEnviarPendiente()
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw-perimetro.js').catch(() => {})
  }
})
</script>
</body>
</html>
